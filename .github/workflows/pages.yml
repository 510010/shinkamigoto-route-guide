name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate CSV data
        run: python3 scripts/validate.py
      - name: Build data.json
        run: python3 scripts/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub Pages のデプロイ受付が即時エラーで弾かれることがあるため
      # （2026-11-24 実測：成功時は約7秒、失敗時は0〜1秒で即死、直近15回中5回失敗）、
      # 1回目が失敗したら60秒置いて1回だけ再試行する。再試行も失敗したらジョブを失敗にする。
      - name: Wait before deploy retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
